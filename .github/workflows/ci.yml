name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify script runs
        run: python python_framework.py --version

      - name: Test dry-run
        run: python python_framework.py --name TestProject --dry-run

      - name: Test project generation
        run: |
          python python_framework.py --name GeneratedProject --no-venv
          cd GeneratedProject
          python -c "import sys; sys.path.insert(0, 'src'); import generatedproject"

      - name: Test update mode
        run: |
          python python_framework.py --name GeneratedProject --update

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile python_framework.py
