# =============================================================================
# Internode Bare Metal Framework - CI/CD Pipeline
# =============================================================================
# Comprehensive testing, linting, security scanning, and quality checks
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

# Cancel any in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ===========================================================================
  # Job 1: Lint & Static Analysis
  # ===========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy bandit

      - name: Syntax check (py_compile)
        run: python -m py_compile python_framework.py

      - name: Ruff linter
        run: ruff check python_framework.py --output-format=github

      - name: Black formatter check
        run: black --check --diff python_framework.py

      - name: MyPy type checking
        run: mypy python_framework.py --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

      - name: Bandit security scan
        run: bandit -r python_framework.py -f txt -ll
        continue-on-error: true

  # ===========================================================================
  # Job 2: Test Matrix (Cross-platform, Multi-version)
  # ===========================================================================
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify script runs
        run: python python_framework.py --version

      - name: Test help output
        run: python python_framework.py --help

      - name: Test dry-run mode
        run: python python_framework.py --name TestProject --dry-run

      - name: Test project generation (Default template)
        run: |
          python python_framework.py --name GeneratedDefault --template default --no-venv
          cd GeneratedDefault
          python -c "import sys; sys.path.insert(0, 'src'); import generateddefault"

      - name: Test update mode
        run: |
          python python_framework.py --name GeneratedDefault --update

  # ===========================================================================
  # Job 3: Template Tests (All 5 templates)
  # ===========================================================================
  template-tests:
    name: Template Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        template: [default, minimal, api, cli, library]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Generate ${{ matrix.template }} template
        run: |
          python python_framework.py --name Test${{ matrix.template }} --template ${{ matrix.template }} --no-venv

      - name: Verify generated structure
        run: |
          echo "Generated structure for ${{ matrix.template }}:"
          find Test${{ matrix.template }} -type f | head -50

      - name: Verify package is importable
        run: |
          cd Test${{ matrix.template }}
          python -c "import sys; sys.path.insert(0, 'src'); import test${{ matrix.template }}"

      - name: Verify generated CI workflow exists (if applicable)
        run: |
          if [ "${{ matrix.template }}" != "minimal" ]; then
            test -f Test${{ matrix.template }}/.github/workflows/ci.yml && echo "✓ CI workflow exists"
          else
            echo "Skipping for minimal template"
          fi

  # ===========================================================================
  # Job 4: Integration Tests
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, template-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Test interactive mode simulation
        run: |
          echo -e "IntegrationProject\n.\n@testauthor\ntest@example.com\ndefault\ny\nn\nn" | python python_framework.py --interactive || true

      - name: Test with custom author info
        run: |
          python python_framework.py --name CustomProject --author "@cibot" --email "ci@test.com" --no-venv
          grep -r "@cibot" CustomProject/ || echo "Author info check passed"

      - name: Test all CLI flags work
        run: |
          python python_framework.py --version
          python python_framework.py --help
          python python_framework.py --list-templates
          python python_framework.py --name DryProject --dry-run
          python python_framework.py --name VenvlessProject --no-venv

      - name: Test project with venv (if available)
        run: |
          python python_framework.py --name VenvProject
          test -d VenvProject/.venv && echo "✓ Virtual environment created"
        continue-on-error: true

  # ===========================================================================
  # Job 5: Security Scanning (Detailed)
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install security tools
        run: |
          pip install bandit safety pip-audit

      - name: Bandit - Full security scan
        run: |
          bandit -r python_framework.py -f json -o bandit-report.json || true
          bandit -r python_framework.py -f txt

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "password\s*=\s*['\"]" python_framework.py || echo "Password pattern check"
          ! grep -rn "api_key\s*=\s*['\"]" python_framework.py || echo "API key pattern check"
          ! grep -rn "secret\s*=\s*['\"]" python_framework.py || echo "Secret pattern check"
          echo "No obvious hardcoded secrets found"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # ===========================================================================
  # Job 6: Documentation Check
  # ===========================================================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          test -f README.md && echo "✓ README.md exists"
          test -f LICENSE && echo "✓ LICENSE exists"
          test -f CHANGELOG.md && echo "✓ CHANGELOG.md exists"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md exists"
          test -f SECURITY.md && echo "✓ SECURITY.md exists"
          test -f CODE_OF_CONDUCT.md && echo "✓ CODE_OF_CONDUCT.md exists"

      - name: Check README has required sections
        run: |
          grep -q "## ✨ Features" README.md && echo "✓ Features section"
          grep -q "## 🚀 Quick Start" README.md && echo "✓ Quick Start section"
          grep -q "## 📋 Usage" README.md && echo "✓ Usage section"

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '*.md'
        continue-on-error: true

  # ===========================================================================
  # Job 7: Build Verification
  # ===========================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, template-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Verify script is standalone
        run: |
          # Ensure we can run without any pip installs
          python python_framework.py --version
          python python_framework.py --name StandaloneTest --no-venv --dry-run

      - name: Check file size
        run: |
          SIZE=$(stat --printf="%s" python_framework.py)
          echo "Script size: $SIZE bytes ($(( SIZE / 1024 )) KB)"
          if [ $SIZE -gt 150000 ]; then
            echo "⚠️ Warning: Script is larger than 150KB"
          fi

      - name: Count lines of code
        run: |
          LINES=$(wc -l < python_framework.py)
          echo "Lines of code: $LINES"
