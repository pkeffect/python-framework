# =============================================================================
# Internode Bare Metal Framework - Release Automation
# =============================================================================
# Automatically creates GitHub releases when a version tag is pushed
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.3.1

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Pre-release Validation
  # ===========================================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: extract
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Verify version in script matches tag
        run: |
          SCRIPT_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"']([^\"']+)[\"']', open('python_framework.py').read()).group(1))")
          TAG_VERSION=${{ steps.extract.outputs.version }}
          echo "Script version: $SCRIPT_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$SCRIPT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! Script has $SCRIPT_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
          echo "✓ Versions match!"

      - name: Run tests before release
        run: |
          python python_framework.py --version
          python python_framework.py --name ReleaseTest --dry-run

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          echo "Extracting changelog for v$VERSION..."
          
          # Extract the section for this version from CHANGELOG.md
          # This assumes changelog follows Keep a Changelog format
          CHANGELOG=$(awk "/^## \[?$VERSION\]?/{flag=1; next} /^## \[?[0-9]+\.[0-9]+\.[0-9]+\]?/{flag=0} flag" CHANGELOG.md)
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release v$VERSION of Internode Bare Metal Framework"
          fi
          
          # Save to file to preserve formatting
          echo "$CHANGELOG" > release_notes.md
          echo "Release notes extracted"

      - name: Generate release body
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          cat << 'EOF' > release_body.md
          # Internode Bare Metal Framework v${{ needs.validate.outputs.version }}
          
          > **Single-file, zero-dependency Python project generator**
          
          ## 📦 Installation
          
          ```bash
          # Clone or download this release
          git clone https://github.com/pkeffect/python-framework.git
          cd python-framework
          
          # Or download just the script
          curl -O https://raw.githubusercontent.com/pkeffect/python-framework/v${{ needs.validate.outputs.version }}/python_framework.py
          ```
          
          ## 🚀 Quick Start
          
          ```bash
          # Generate a project
          python python_framework.py --name MyProject
          
          # Use the GUI
          python python_framework.py --gui
          ```
          
          ## 📝 What's Changed
          
          EOF
          
          cat release_notes.md >> release_body.md
          
          cat << 'EOF' >> release_body.md
          
          ---
          
          ## ✅ Requirements
          
          - Python 3.11+
          - No external dependencies
          
          ## 📄 Assets
          
          - `python_framework.py` - The complete framework generator (single file)
          
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ needs.validate.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: |
            python_framework.py
            LICENSE
            README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Post-release Notifications
  # ===========================================================================
  notify:
    name: Post-release
    runs-on: ubuntu-latest
    needs: [validate, release]
    steps:
      - name: Release summary
        run: |
          echo "🎉 Release v${{ needs.validate.outputs.version }} created successfully!"
          echo ""
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }}"
